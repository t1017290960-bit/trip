<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>廣州3日食玩</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5f1}.hidebar::-webkit-scrollbar{display:none}.route:before{content:"";position:absolute;left:10px;top:28px;bottom:-20px;border-left:1px dashed #e7c7a8}.stop:last-child .route:before{display:none}</style></head><body class="text-stone-800"><main class="max-w-md mx-auto min-h-screen bg-[#faf8f4] pb-8"><header class="p-5 pb-6 text-white rounded-b-[2rem] bg-gradient-to-br from-orange-500 via-rose-500 to-pink-600"><div class="flex justify-between items-center"><span class="text-sm font-semibold opacity-90">廣州 · 城市漫遊</span><span class="text-xs bg-white/20 rounded-full px-3 py-1">3日行程</span></div><h1 class="text-3xl font-bold mt-6">食好啲，行慢啲</h1><p class="text-white/85 mt-2 text-sm">街區漫步 × 地道美食 · 精選路線</p><div class="mt-5 flex gap-2 text-xs"><span class="bg-white/20 rounded-full px-3 py-1.5">🍜 11間美食</span><span class="bg-white/20 rounded-full px-3 py-1.5">🚇 市區分區玩</span></div></header><section class="px-4 mt-5"><div class="mb-4 p-4 rounded-2xl bg-white border border-stone-100 shadow-sm"><div class="flex justify-between items-center"><p class="font-bold text-sm">📍 行程起點</p><span class="text-[10px] bg-orange-50 text-orange-700 rounded-full px-2 py-1">每日由此出發</span></div><p class="text-sm font-semibold mt-2">廣州市越秀區珠光街道東沙角路42號</p><p class="text-xs text-stone-500 mt-2">前往當日第一站：<b id="firstStop" class="text-stone-700"></b></p><label class="flex items-center justify-between gap-3 mt-3 text-xs font-semibold text-stone-600">選擇地圖<select id="mapProvider" class="rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm text-stone-800"><option value="amap">高德地圖</option><option value="baidu">百度地圖</option><option value="tencent">騰訊地圖</option><option value="google">Google 地圖</option></select></label><div id="routeSketch" class="mt-3 flex gap-2 overflow-x-auto hidebar whitespace-nowrap text-[11px]"></div><div class="grid grid-cols-2 gap-2 mt-3"><a id="originSubway" target="_blank" rel="noopener" class="text-center text-xs rounded-xl bg-blue-50 text-blue-800 py-2.5 font-semibold">🚇 地鐵路線</a><a id="originBus" target="_blank" rel="noopener" class="text-center text-xs rounded-xl bg-green-50 text-green-800 py-2.5 font-semibold">🚌 巴士路線</a><a id="originAll" target="_blank" rel="noopener" class="text-center text-xs rounded-xl bg-stone-100 text-stone-700 py-2.5 font-semibold">🗺️ 公共交通方案</a><a id="originWalk" target="_blank" rel="noopener" class="text-center text-xs rounded-xl bg-amber-50 text-amber-800 py-2.5 font-semibold">🚶 步行路線</a></div><p class="text-[10px] text-stone-400 mt-2">簡易路線示意，不按比例；站點、班次及轉乘以地圖即時結果為準。</p></div><div class="flex gap-2 overflow-x-auto hidebar" id="tabs"></div><div class="flex justify-between items-center mt-5 mb-3"><div><p id="dayTitle" class="text-xl font-bold"></p><p id="daySub" class="text-xs text-stone-500 mt-1"></p></div><span id="doneCount" class="text-xs text-orange-700 bg-orange-100 rounded-full px-3 py-1"></span></div><div id="stops" class="space-y-3"></div><div class="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-100"><p class="font-semibold text-sm">💡 小貼士</p><p class="text-xs text-stone-600 mt-1 leading-relaxed">永慶坊小食多，建議幾人分食；龍洞離市中心較遠，第 1 日請預留交通時間，不想趕可改作半日替代行程。店舖營業時間及分店地址出發前再確認。</p></div><p class="text-center text-[11px] text-stone-400 mt-5">收藏與行程進度會保存在此裝置</p></section></main><script>
const ORIGIN='廣州市越秀區珠光街道東沙角路42號';let mapProvider='amap';function routeUrl(from,to,mode='transit',transitMode=''){const kind=mode==='walking'?'walk':'bus';if(mapProvider==='google'){const q=new URLSearchParams({api:'1',origin:from+'，廣州',destination:to+'，廣州',travelmode:mode==='walking'?'walking':'transit'});if(transitMode)q.set('transit_mode',transitMode);return 'https://www.google.com/maps/dir/?'+q.toString()}if(mapProvider==='baidu'){const q=new URLSearchParams({origin:'name:'+from,destination:'name:'+to,mode:mode==='walking'?'walking':'transit',region:'廣州',output:'html'});return 'https://map.baidu.com/direction?'+q.toString()}if(mapProvider==='tencent'){const q=new URLSearchParams({type:kind,from:from,to:to,policy:'0',referer:'SayoTrip'});return 'https://apis.map.qq.com/uri/v1/routeplan?'+q.toString()}const q=new URLSearchParams({from:',,'+from,to:',,'+to,mode:kind,coordinate:'gaode',callnative:'0'});if(transitMode==='subway')q.set('policy','1');return 'https://uri.amap.com/navigation?'+q.toString()}const days=[
{title:'龍洞 · 六運小區 · 體育西',sub:'第 1 日｜龍洞半日遊＋天河商圈（預留交通時間）',stops:[['09:30','龍洞步行街','街區漫步','龍洞較遠，建議預留往返交通時間；想輕鬆玩可改為半日選項。','📍 街區'],['12:30','狎鷗亭韓國料理','午餐','韓國料理，建議先查看分店位置與營業時間。','🍽️ 正餐'],['14:00','六運小區','街區漫步','天河中心的社區街區，適合慢逛咖啡店與特色小店；留意人流及營業時間。','🏙️ 街區'],['15:30','體育西路','商圈漫步','沿天河商圈逛街或休息，再安排附近甜品。','📍 街區'],['16:30','荔芳傳統糖水鋪／Chill chill 丘丘','甜品・飲品','二選一休息；與同行朋友分享更容易留肚。','🍧 甜品'],['18:30','花城廣場（可選）','散步・夜景','飯後散步選項，按體力及天氣決定。','🌆 景點']]},
{title:'東山口 · 北京路 · 越秀',sub:'第 2 日｜洋樓街區・老城漫遊・茶飲火鍋',stops:[['09:30','東山口','街區漫步','逛特色洋樓、小店與咖啡店，適合散步拍照；先確認店舖營業時間。','🏙️ 街區'],['11:30','北京路步行街','街區漫步','由東山口轉往北京路一帶，預留時間逛街和休息。','📍 街區'],['13:00','拍檔飯堂','午餐','清單中的午餐選擇，出發前查看最新地址。','🍽️ 正餐'],['15:00','李山山茶事','茶飲休息','逛街中途坐低休息，記得預留火鍋的胃口。','🧋 茶飲'],['16:00','越秀南路風味館（備選）','備選美食','可作替換或加餐；先核實位置是否順路。','🥢 備選'],['18:00','潮發潮汕牛肉火鍋','晚餐','安排作一餐正餐；繁忙時段預留等位時間。','🥘 正餐']]},
{title:'文化公園 · 永慶坊 · 江南西',sub:'第 3 日｜飲茶・西關小食・煲仔飯',stops:[['09:30','銀燈茶樓','早茶','先飲茶，再到文化公園一帶散步。','🍵 早茶'],['11:00','文化公園','公園漫步','輕鬆走走，留意天氣與步行距離。','🌳 景點'],['12:30','永慶坊・恩寧路','街區漫步','小食集中，建議分食，按現場營業情況挑店。','📍 街區'],['13:00','蓮香樓／麗的麵家／啫成啫煲','午餐候選','三選一作正餐；其他店當小食或下次再訪。','🍽️ 正餐'],['15:00','恩寧雪糕行・陳雙記砵仔糕','甜品小食','二選一或分享小份，避免太快吃飽。','🍦 小食'],['16:00','曲奇家／有喜糖水舖／Locker room (coffee)','休息候選','按口味與營業時間選一間休息。','☕ 休息'],['18:30','江南西 · 民記煲仔飯','晚餐','以煲仔飯作結；出發前核對店舖分店位置。','🍚 晚餐']]}
];let day=0,saved={likes:[],done:[]};const tabs=document.getElementById('tabs'),stops=document.getElementById('stops');function key(d,i){return d+'-'+i}function paint(){document.getElementById('mapProvider').value=mapProvider;tabs.innerHTML=days.map((d,i)=>`<button data-day="${i}" class="shrink-0 px-4 py-2 rounded-full text-sm font-semibold ${i===day?'bg-stone-900 text-white':'bg-white text-stone-600 border border-stone-200'}">第 ${i+1} 日</button>`).join('');document.getElementById('dayTitle').textContent=days[day].title;document.getElementById('daySub').textContent=days[day].sub;const first=days[day].stops[0][1];document.getElementById('firstStop').textContent=first;document.getElementById('routeSketch').innerHTML=['起點',...days[day].stops.map(s=>s[1])].map((name,i)=>`<span class="shrink-0 rounded-full px-2.5 py-1 ${i?'bg-orange-50 text-orange-800':'bg-stone-100 text-stone-700'}">${i?'→ ':''}${name}</span>`).join('');[['originSubway','transit','subway'],['originBus','transit','bus'],['originAll','transit',''],['originWalk','walking','']].forEach(([id,mode,kind])=>document.getElementById(id).href=routeUrl(ORIGIN,first,mode,kind));stops.innerHTML=days[day].stops.map((s,i)=>{let k=key(day,i),done=saved.done.includes(k),like=saved.likes.includes(k);return `<article class="stop relative rounded-2xl bg-white p-4 shadow-sm border border-stone-100"><div class="flex gap-3"><div class="route relative w-6 shrink-0"><span class="relative z-10 block w-5 h-5 rounded-full bg-orange-100 text-orange-700 text-[10px] font-bold text-center leading-5">${i+1}</span></div><div class="flex-1 min-w-0"><div class="flex justify-between gap-2"><span class="text-xs font-bold text-orange-600">${s[0]}</span><span class="text-[10px] px-2 py-1 rounded-full bg-stone-100 text-stone-600 whitespace-nowrap">${s[4]}</span></div><h3 class="font-bold mt-1">${s[1]}</h3><p class="text-xs text-stone-500 mt-1">${s[2]} · ${s[3]}</p><div class="flex gap-2 mt-3"><button data-done="${k}" class="text-xs px-3 py-1.5 rounded-full ${done?'bg-emerald-100 text-emerald-700':'bg-stone-100 text-stone-600'}">${done?'✓ 去過':'○ 標記去過'}</button><button data-like="${k}" class="text-xs px-3 py-1.5 rounded-full bg-rose-50 text-rose-600">${like?'♥ 已收藏':'♡ 收藏'}</button></div>${days[day].stops[i+1]?`<div class="mt-3 pt-3 border-t border-stone-100"><p class="text-[11px] font-semibold text-stone-600 mb-2">下一站：${days[day].stops[i+1][1]}</p><div class="flex gap-2"><a target="_blank" rel="noopener" href="${routeUrl(s[1],days[day].stops[i+1][1],'transit','subway')}" class="text-[10px] rounded-full bg-blue-50 text-blue-800 px-3 py-1.5">🚇 地鐵</a><a target="_blank" rel="noopener" href="${routeUrl(s[1],days[day].stops[i+1][1],'transit','bus')}" class="text-[10px] rounded-full bg-green-50 text-green-800 px-3 py-1.5">🚌 巴士</a><a target="_blank" rel="noopener" href="${routeUrl(s[1],days[day].stops[i+1][1],'walking')}" class="text-[10px] rounded-full bg-amber-50 text-amber-800 px-3 py-1.5">🚶 步行</a></div></div>`:''}</div></div></article>`}).join('');let count=days[day].stops.filter((_,i)=>saved.done.includes(key(day,i))).length;document.getElementById('doneCount').textContent=`已去 ${count} / ${days[day].stops.length}`;document.getElementById('mapProvider').onchange=async e=>{mapProvider=e.target.value;try{await window.sayoStorage.setItem('gz-map-provider',mapProvider)}catch(err){console.warn('Could not save map preference',err)}paint()};tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{day=+b.dataset.day;paint()});stops.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{let k=b.dataset.done;saved.done=saved.done.includes(k)?saved.done.filter(x=>x!==k):[...saved.done,k];await window.sayoStorage.setItem('gz-trip',JSON.stringify(saved));paint()});stops.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{let k=b.dataset.like;saved.likes=saved.likes.includes(k)?saved.likes.filter(x=>x!==k):[...saved.likes,k];await window.sayoStorage.setItem('gz-trip',JSON.stringify(saved));paint()})}async function init(){try{let raw=await window.sayoStorage.getItem('gz-trip');if(raw)saved=JSON.parse(raw);let pref=await window.sayoStorage.getItem('gz-map-provider');if(['amap','baidu','tencent','google'].includes(pref))mapProvider=pref}catch(e){console.warn('Could not load saved itinerary or map preference',e)}paint()}init();</script></body></html>
